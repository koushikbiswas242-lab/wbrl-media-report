<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WBRL Media Report</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>body{font-family:Arial;margin:0;background:#edf3f5;color:#263b4a}.wrap{max-width:1200px;margin:auto;padding:18px}header{background:#087985;color:white;padding:18px}.card,.stat{background:white;border:1px solid #c9d4d7;border-radius:12px;padding:16px;margin-bottom:15px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}button{background:#087985;color:white;border:0;border-radius:8px;padding:11px 15px;font-weight:bold}input{padding:10px;border:1px solid #bbb;border-radius:7px}.queue{margin-top:12px;padding:10px;border:1px solid #ddd;max-height:160px;overflow:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat b{display:block;font-size:25px}.table{overflow:auto}table{border-collapse:collapse;width:max-content;min-width:100%}th,td{border:1px solid #aaa;padding:8px;text-align:center}th{background:#168fa0;color:white}.yes{background:#dff5e5;font-weight:bold}.total{background:#fff4d6;font-weight:bold}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}button{width:100%}}</style></head>
<body><header><div class="wrap"><h1>WBRL Media Report</h1><div>WhatsApp Media • 10 Digit WP Number • Excel Report</div></div></header><main class="wrap">
<div class="card"><b>WhatsApp Export Files</b><div class="controls"><button id="add">+ Add Another File</button><button id="clear">Clear Files</button><label>From <input id="from" type="date"></label><label>To <input id="to" type="date"></label><button id="analyze">Analyze All Files</button><button id="download">Download Excel</button></div><input id="picker" type="file" accept=".zip,.txt" multiple hidden><div class="queue" id="queue">No files added yet.</div><p id="status"></p></div>
<div class="stats"><div class="stat">Chat Files<b id="cf">0</b></div><div class="stat">Media Senders<b id="ms">0</b></div><div class="stat">Photos<b id="ph">0</b></div><div class="stat">Videos<b id="vi">0</b></div></div>
<div class="card"><h2>Date-wise Media Report</h2><div class="table"><table id="report"><thead><tr><th>AWW WP NO</th></tr></thead><tbody><tr><td>Upload files and Analyze.</td></tr></tbody></table></div></div></main>
<script>
let files=[],DATA={dates:[],senders:[],m:{}},COUNTS={files:0,photos:0,videos:0};const $=x=>document.getElementById(x);
$('add').onclick=()=>$('picker').click();$('clear').onclick=()=>{files=[];queue()};
$('picker').onchange=e=>{for(const f of e.target.files)if(!files.some(x=>x.name===f.name&&x.size===f.size))files.push(f);e.target.value='';queue()};
function queue(){$('queue').innerHTML=files.length?'<b>'+files.length+' file(s) ready</b>'+files.map((f,i)=>'<div>'+(i+1)+'. '+f.name+'</div>').join(''):'No files added yet.'}
function phone(v){let d=String(v||'').replace(/\D/g,'');if(d.length===12&&d.startsWith('91'))d=d.slice(2);if(d.length>10)d=d.slice(-10);return d.length===10?d:''}
function type(t){t=(t||'').toLowerCase();if(/(image|photo|picture).*(omitted|attached)|\.(jpg|jpeg|png|webp|heic)\b/.test(t))return'P';if(/video.*(omitted|attached)|\.(mp4|mov|3gp|mkv|avi|webm)\b/.test(t))return'V';return null}
function date(raw){let m=raw.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);if(!m)return null;let d=+m[1],mo=+m[2],y=+m[3];if(y<100)y+=2000;if(d<=12&&mo>12)[d,mo]=[mo,d];let x=new Date(y,mo-1,d);return isNaN(x)?null:x}
function iso(d){return d.toISOString().slice(0,10)}function allowed(d){let x=iso(d),f=$('from').value,t=$('to').value;return(!f||x>=f)&&(!t||x<=t)}
function parse(txt){txt=txt.replace(/\r/g,'');let ls=txt.split('\n'),re=/^(?:\[)?(\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4})[,\s]+(\d{1,2}:\d{2}(?::\d{2})?\s*(?:AM|PM|am|pm)?)(?:\])?\s*[-–]\s*/,a=[],c='';for(let l of ls){if(re.test(l)){if(c)a.push(c);c=l}else if(c)c+='\n'+l}if(c)a.push(c);let out=[];for(let e of a){let z=e.match(re);if(!z)continue;let d=date(z[1]);if(!d||!allowed(d))continue;let r=e.slice(z[0].length).match(/^([^:\n]{1,180}):\s*([\s\S]*)$/);if(!r)continue;let q=type(r[2]),p=phone(r[1]);if(q&&p)out.push({p,d:iso(d),q})}return out}
async function read(f){if(f.name.toLowerCase().endsWith('.txt'))return[await f.text()];let z=await JSZip.loadAsync(await f.arrayBuffer()),a=[];for(let n in z.files)if(!z.files[n].dir&&n.toLowerCase().endsWith('.txt'))a.push(await z.files[n].async('text'));return a}
$('analyze').onclick=async()=>{if(!files.length){$('status').textContent='Please add files first.';return}try{let rows=[],n=0;for(let f of files){let ts=await read(f);n+=ts.length;ts.forEach(t=>rows.push(...parse(t)))}let ds=[...new Set(rows.map(x=>x.d))].sort(),ss=[...new Set(rows.map(x=>x.p))].sort(),m={};ss.forEach(s=>{m[s]={};ds.forEach(d=>m[s][d]={P:0,V:0})});rows.forEach(x=>m[x.p][x.d][x.q]++);DATA={dates:ds,senders:ss,m};COUNTS={files:n,photos:rows.filter(x=>x.q==='P').length,videos:rows.filter(x=>x.q==='V').length};render();$('status').textContent='Completed. All numbers converted to 10 digits.'}catch(e){$('status').textContent='Error: '+e.message}}
function show(d){let a=d.split('-');return a[2]+'/'+a[1]+'/'+a[0]}
function render(){$('cf').textContent=COUNTS.files;$('ms').textContent=DATA.senders.length;$('ph').textContent=COUNTS.photos;$('vi').textContent=COUNTS.videos;let t=$('report');if(!DATA.senders.length){t.innerHTML='<thead><tr><th>AWW WP NO</th></tr></thead><tbody><tr><td>No valid 10 digit numbers found.</td></tr></tbody>';return}let h='<tr><th rowspan="2">AWW WP NO</th>';DATA.dates.forEach(d=>h+='<th colspan="2">'+show(d)+'</th>');h+='<th rowspan="2">Total Photo</th><th rowspan="2">Total Video</th></tr><tr>';DATA.dates.forEach(()=>h+='<th>Photo</th><th>Video</th>');h+='</tr>',b='';DATA.senders.forEach(s=>{let p=0,v=0;b+='<tr><td>'+s+'</td>';DATA.dates.forEach(d=>{let x=DATA.m[s][d];p+=x.P;v+=x.V;b+='<td class="'+(x.P?'yes':'')+'">'+(x.P?'YES':'NO')+'</td><td class="'+(x.V?'yes':'')+'">'+(x.V?'YES':'NO')+'</td>'});b+='<td class="total">'+p+'</td><td class="total">'+v+'</td></tr>'});t.innerHTML='<thead>'+h+'</thead><tbody>'+b+'</tbody>'}
$('download').onclick=()=>{if(!DATA.senders.length){$('status').textContent='Analyze files first.';return}let a=[['AWW WP NO'],['']];DATA.dates.forEach(d=>{a[0].push(show(d),'');a[1].push('Photo','Video')});a[0].push('Total Photo','Total Video');a[1].push('','');DATA.senders.forEach(s=>{let r=[s],p=0,v=0;DATA.dates.forEach(d=>{let x=DATA.m[s][d];p+=x.P;v+=x.V;r.push(x.P?'YES':'NO',x.V?'YES':'NO')});r.push(p,v);a.push(r)});let ws=XLSX.utils.aoa_to_sheet(a),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Media Report');XLSX.writeFile(wb,'WBRL_WhatsApp_Media_Report.xlsx')}
</script></body></html>
